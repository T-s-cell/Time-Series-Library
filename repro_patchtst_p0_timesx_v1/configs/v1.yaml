  "optim": {
    "lrs": [0.0001, 0.001, 0.01],
    "weight_decay": 0.0, "betas": [0.9, 0.999], "eps": 1e-8,
    "clip_grad": 1.0,
    "batch": 32, "microbatch": 32, "accum": 1,
    "scheduler": "none (fixed lr per candidate)",
    "loss": "mean_batch(mean_12steps(((pred-target)/d_i)^2)); d_i from raw history, no gradient"
  },

  "divergence_protocol": {
    "definition": "NaN/Inf in loss, gradients, parameters, or validation outputs. Large errors or temporary increases are NOT divergence.",
    "candidate_handling": "mark DIVERGED with persisted evidence (epoch, update, reason, loss/grad trail), continue all other candidates; never re-run with a different seed",
    "selection_rule": "any diverged seed makes the (domain, lr) selection score +inf; never average the remaining successful seeds; other domains may still use that lr",
    "freeze_condition": "all 171 candidates hold a terminal state (success|diverged) AND every domain has >=1 lr whose 3 seeds all succeeded",
    "must_stop_queue": "all lrs of a domain unavailable, OOM, data error, code error - never waived by dropping candidates or domains",
    "disclosure": "final report lists every diverged (domain, lr, seed) with divergence location",
    "exception_class": "DivergenceError (numerical divergence only; OOM/data/code errors are separate fatal classes)"
  },

