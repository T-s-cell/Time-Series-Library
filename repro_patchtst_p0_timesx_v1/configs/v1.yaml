  "sampling": {
    "pool": "native",
    "balance": "S_d slots split as equally as possible among the domain's vars; remainder slots by per-epoch fixed-seed rotation; within-var uniform WITH replacement from the variable's native train pool of sample_ids; slot order shuffled",
    "alignment": "same RNG families and formulas as the LN run's build_slots F0 native branch: epochs 1..10 reproduce LN F0 sampling for the same (domain, seed); later epochs continue the same rule; budget stays dense-derived: U_d = ceil(D_dense_d/32), never shrunk to native pool size",
    "rng_families": {
      "slot_remainder": "np.random.default_rng([seed, 3000+domain_idx, epoch]).permutation(n_vars)[:rem]",
      "shuffle": "np.random.default_rng([seed, 7000+domain_idx, epoch]).permutation(len(slots))",
      "base_indices": "np.random.default_rng([seed, 9000+domain_idx, epoch]).integers(0, pool_n, size=k) where pool_n = len(native train sample_ids); slots hold sample_id strings resolved via sample_start_idx",
      "torch_init": "int(np.random.default_rng([seed, 1100+domain_idx]).integers(0, 2**31-1)) -> torch.manual_seed; identical initial weights across lrs for the same (domain, seed)",
      "py_np_seed": "int(np.random.default_rng([seed, 1200+domain_idx]).integers(0, 2**31-1)) -> random.seed / np.random.seed",
      "note": "all generators re-derived from constant seeds at every epoch start; never resumed from pickled streams; sampling independent of lr and init"
    },
    "epoch_index_hash": "sha256 of the epoch's slot list recorded in the epoch_end jsonl row"
  },

  "selection": {
    "metric": "val std-MSE: per-window d_i (fallback rule), mean over 12 steps; per-var mean then var-equal mean across the domain's native val windows",
    "epoch_range": [1, 100],
    "improve_rule": "v < best - 1e-8*max(1,best); near-ties keep the earlier epoch",
    "tie_tol": 1e-8,
    "patience": 15,
    "lr_rule": "per domain per lr: arithmetic mean of the 3 seeds' best val std-MSE; any diverged seed -> +inf (never average remaining seeds); lowest mean wins; |a-b| <= 1e-8*max(1,min) tie -> smaller lr",
    "keep": "all three seeds' best checkpoints of the selected lr; no best-seed picking, no ensembling, no retraining on val"
  },

  "test": {
    "only_after_freeze": true,
    "eval_batch": 64,
    "eval_dtype": "float64",
    "aggregation": "window mean -> var equal -> domain equal -> 19-domain overall; 3-seed mean+/-std(ddof=1)",
    "per_seed_coverage": 2474,
    "raw_scale": "raw-scale metrics reported only as per-variable supplements",
    "counting_note": "each of the 57 selected models predicts ONLY its own domain's native test windows; per seed the union over the 19 domain models is exactly the 2,474 unique native test windows (3 x 2,474 = 7,422 window predictions total)"
  },

